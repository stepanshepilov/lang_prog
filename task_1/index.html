<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Локальный AI чат</title>
<style>
:root{color-scheme:dark;font:16px/1.5 system-ui,sans-serif;background:#0b1020;color:#eef2ff}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(ellipse at 20% 0%,#1d3150,#0b1020 60%)}.shell{width:min(820px,94vw);height:min(760px,94vh);min-height:480px;display:flex;flex-direction:column;border:1px solid #29334b;border-radius:22px;background:#11182a;box-shadow:0 24px 80px #0008;overflow:hidden}header{display:flex;align-items:center;justify-content:space-between;padding:20px 24px;border-bottom:1px solid #29334b}.brand{display:flex;align-items:center;gap:14px}.logo{display:grid;place-items:center;width:42px;height:42px;border-radius:14px;background:#b9f27c;color:#18220f;font-size:23px}h1{font-size:18px;margin:0}header p{margin:2px 0 0;color:#9aa8c2;font-size:13px}.status{padding:9px 24px;color:#a8b7d1;font-size:12px;border-bottom:1px solid #202a40}.status:before{content:"";display:inline-block;width:7px;height:7px;background:#a5e66e;border-radius:50%;margin:0 8px 1px 0}#chat{flex:1;overflow:auto;padding:22px 24px;display:flex;flex-direction:column;gap:14px}.msg{max-width:82%;padding:12px 15px;border-radius:16px;white-space:pre-wrap;overflow-wrap:anywhere}.assistant{background:#202b42;align-self:flex-start;border-bottom-left-radius:5px}.user{background:#c7f58d;color:#17220d;align-self:flex-end;border-bottom-right-radius:5px}.system{align-self:center;background:#472b38;color:#ffd9df;font-size:13px}form{display:flex;gap:10px;padding:14px 18px;border-top:1px solid #29334b}textarea{flex:1;resize:none;min-height:48px;max-height:140px;padding:12px;border:1px solid #35415a;border-radius:12px;background:#0d1424;color:#eef2ff;font:inherit;outline:none}textarea:focus{border-color:#a5e66e}button{border:0;border-radius:11px;padding:0 17px;background:#b9f27c;color:#18220f;font:600 14px system-ui;cursor:pointer}#clear{padding:9px 12px;background:#202b42;color:#cbd5e8}button:disabled{opacity:.5;cursor:default}.hint{margin:0;padding:0 24px 14px;color:#71809a;font-size:11px}@media(max-width:560px){.shell{width:100vw;height:100dvh;border-radius:0}.msg{max-width:94%}header{padding:16px}}
.msg,textarea{min-width:0}form{min-width:0}
</style></head>
<body><main class="shell">
<header><div class="brand"><div class="logo">✦</div><div><h1>Локальный AI чат</h1><p>DeepSeek · MCP · ваши заметки</p></div></div><button id="clear" title="Очистить историю">Новый чат</button></header>
<div id="status" class="status">Подключение…</div>
<section id="chat" aria-live="polite"><div class="msg assistant">Привет! Я могу отвечать на вопросы и искать по вашим файлам Markdown.</div></section>
<form id="form"><textarea id="input" placeholder="Напишите сообщение…" aria-label="Сообщение" required></textarea><button id="send" disabled>Отправить</button></form>
<p class="hint">Enter отправляет · Shift + Enter — новая строка · MCP ищет только в папке documents/</p>
</main>
<script>
const chat=document.querySelector("#chat"),form=document.querySelector("#form"),input=document.querySelector("#input"),send=document.querySelector("#send"),status=document.querySelector("#status"),clear=document.querySelector("#clear");let ws;
function bubble(text,kind="assistant"){const node=document.createElement("div");node.className=`msg ${kind}`;node.textContent=text;chat.append(node);chat.scrollTop=chat.scrollHeight;return node}
function connect(){const scheme=location.protocol==="https:"?"wss":"ws";ws=new WebSocket(`${scheme}://${location.host}/ws`);ws.onopen=()=>{status.textContent="MCP и чат подключены";send.disabled=false};ws.onclose=()=>{status.textContent="Нет соединения · повторная попытка…";send.disabled=true;setTimeout(connect,2000)};ws.onerror=()=>ws.close();ws.onmessage=event=>{const data=JSON.parse(event.data);if(data.type==="message")bubble(data.text);if(data.type==="error")bubble(data.text,"system");if(data.type==="status")status.textContent=data.text;if(data.type==="reset"){chat.replaceChildren();bubble("Чат очищен. Чем помочь?")}}}
connect();
form.addEventListener("submit",event=>{event.preventDefault();const text=input.value.trim();if(!text||ws?.readyState!==WebSocket.OPEN)return;bubble(text,"user");ws.send(JSON.stringify({message:text}));input.value=""});
input.addEventListener("keydown",event=>{if(event.key==="Enter"&&!event.shiftKey){event.preventDefault();form.requestSubmit()}});clear.addEventListener("click",()=>{if(ws?.readyState===WebSocket.OPEN)ws.send(JSON.stringify({clear:true}))});
</script></body></html>
